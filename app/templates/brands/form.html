
{% extends "base.html" %}

{% block title %}{{ form_title }} | SmartRoster{% endblock %}

{% block content %}

<div class="mb-4">
    <h2 class="fw-bold">{{ form_title }}</h2>
    <p class="text-muted">
        Enter the client brand details.
    </p>
</div>

<div class="card border-0 shadow-sm">

    <div class="card-body p-4">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Brand Name *
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ brand.name if brand else '' }}"
                    placeholder="Enter brand name"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="4"
                    placeholder="Describe the brand..."
                >{{ brand.description if brand else '' }}</textarea>

            </div>

            <hr>

            <div class="d-flex gap-2">

                <button type="submit" class="btn btn-primary">
                    Save Brand
                </button>

                <a href="{{ url_for('main.brands') }}"
                   class="btn btn-outline-secondary">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}

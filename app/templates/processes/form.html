
{% extends "base.html" %}

{% block title %}{{ form_title }} | SmartRoster{% endblock %}

{% block content %}

<div class="mb-4">
    <h2 class="fw-bold">{{ form_title }}</h2>
    <p class="text-muted">Enter the process details.</p>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Process Name *</label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ process.name if process else '' }}"
                    placeholder="Enter process name"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="4"
                    placeholder="Describe this process..."
                >{{ process.description if process else '' }}</textarea>
            </div>

            <hr>

            <button type="submit" class="btn btn-primary">
                Save Process
            </button>

            <a href="{{ url_for('main.processes') }}"
               class="btn btn-outline-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>

{% endblock %}
